[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "net-trace"
version = "0.1.0"
description = "Async traceroute for Windows using scapy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["traceroute", "networking", "cli", "scapy", "windows", "icmp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]
dependencies = [
    "scapy>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
net-trace = "net_trace.cli:main"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/net-trace"
Repository = "https://github.com/YOUR_USERNAME/net-trace"
Issues = "https://github.com/YOUR_USERNAME/net-trace/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/net_trace"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["src/net_trace"]